name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

  # The site's status bands resolve "today" at build time. A daily rebuild is
  # what makes that honest: without it, the flag on every town page freezes on
  # the date of the last commit. 07:10 UTC ≈ 03:10 ET, before anyone is
  # checking whether they can walk the dog on the beach this morning.
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Newest commit wins.
#
# This said `cancel-in-progress: false` with a note that a half-published site
# is worse than a slightly stale one. The reasoning was wrong: a Pages deploy
# publishes its artifact atomically, so a cancelled run publishes nothing — it
# leaves the previous version up, which is the same outcome the queue was
# protecting.
#
# What queuing actually bought was a backlog. Deploys have been taking eleven
# minutes and timing out at the action's ten-minute ceiling, so eight pushes in
# an afternoon became ninety minutes of queue, each run deploying a commit that
# three newer commits had already superseded. The site sat hours behind main
# while every run reported failure.
#
# For a static site the newest commit contains every earlier one. Superseding a
# queued run costs nothing and skips straight to what's true now.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A build stamp, so "did this actually deploy" has an answer that isn't
      # the workflow badge. Written before the build so it lands in dist/.
      - run: echo "$GITHUB_SHA" > public/build-stamp.txt

      - name: Build
        uses: withastro/action@v3
        with:
          # The action defaults to Node 20; Astro 7 requires >=22.12.
          node-version: 22
        env:
          PUBLIC_BEEHIIV_EMBED_URL: ${{ vars.PUBLIC_BEEHIIV_EMBED_URL }}
          # Optional. Unset is fine — /ask/ falls back to a deterministic
          # summary and still returns correct results.
          PUBLIC_CHAT_ENDPOINT: ${{ vars.PUBLIC_CHAT_ENDPOINT }}
          PUBLIC_REPORT_ENDPOINT: ${{ vars.PUBLIC_REPORT_ENDPOINT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # 600000 ms IS the maximum this action accepts — passing more is
          # silently clamped back ("timeout value is greater than the allowed
          # maximum"), so there is no waiting your way out of a slow deploy.
          # On 6 August 2026 both sites failed several deploys in a row, every
          # one timing out here while GitHub reported Pages operational and the
          # artifact was an unremarkable 19MB. The deployments landed anyway,
          # server-side, after the action had given up and reported failure —
          # so a red badge on this step does NOT mean the site is stale, and a
          # green one is not the thing to check. Check the live URL.
          timeout: 600000

      # THE ONLY FAILURE WORTH AN EMAIL.
      #
      # actions/deploy-pages gives up after ten minutes — a hard ceiling you
      # cannot raise — and reports failure. On a slow day the deployment
      # completes server-side anyway, so that failure was arriving as mail
      # about a site that had in fact updated. Mail you can't act on trains you
      # to ignore mail you can.
      #
      # So the deploy step no longer decides. This does: it asks the live site
      # which commit it is serving. Green means the bytes are actually there.
      - name: Did it actually go live
        run: |
          for i in $(seq 1 20); do
            live=$(curl -fsS --max-time 15 "https://delawarefieldguide.com/build-stamp.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live and serving $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $i: live=${live:-none} want=$GITHUB_SHA"
            sleep 30
          done
          echo "::error::The site is still not serving $GITHUB_SHA after ten minutes."
          exit 1
